name: Regression Matrix (Manual)

on:
  workflow_dispatch:
    inputs:
      text_models:
        description: "Comma-separated text models for parity"
        required: false
        default: "gpt2,facebook/opt-125m,Qwen/Qwen2-0.5B,tiiuae/falcon-rw-1b"
      multimodal_models:
        description: "Comma-separated multimodal models for smoke"
        required: false
        default: "Qwen/Qwen2-VL-2B,HuggingFaceTB/SmolVLM-Instruct,fixie-ai/ultravox-v0_5-llama-3_2-1b"
      dtype:
        description: "dtype for matrix run"
        required: false
        default: "float32"
      strict:
        description: "Use strict parity thresholds"
        required: false
        default: "true"

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,multimodal]

      - name: Run stage matrix
        run: |
          STRICT_FLAG=""
          if [ "${{ github.event.inputs.strict }}" = "true" ]; then
            STRICT_FLAG="--strict"
          fi
          python scripts/test_stage_matrix.py \
            --text-models "${{ github.event.inputs.text_models }}" \
            --multimodal-models "${{ github.event.inputs.multimodal_models }}" \
            --dtype "${{ github.event.inputs.dtype }}" \
            --device cpu \
            --output reports/regression_stage_matrix.json \
            $STRICT_FLAG

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: regression-stage-matrix
          path: reports/*.json
