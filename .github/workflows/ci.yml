name: CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff
        run: ruff check meap tests scripts

      - name: Mypy (public API)
        run: mypy

      - name: Pytest
        run: PYTHONPATH=. pytest -q

      - name: Build package
        run: python -m build

      - name: Validate package metadata
        run: twine check dist/*

      - name: Tiny HF smoke matrix
        run: |
          python scripts/smoke_hf_matrix.py \
            --text-models hf-internal-testing/tiny-random-gpt2 \
            --multimodal-models "" \
            --device cpu \
            --dtype float32 \
            --output reports/ci_smoke_hf_matrix.json \
            --quiet

  multimodal-smoke-optional:
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,multimodal]

      - name: Optional multimodal smoke (manual trigger)
        run: |
          python scripts/smoke_hf_matrix.py \
            --text-models "" \
            --multimodal-models Qwen/Qwen2-VL-2B \
            --device cpu \
            --dtype float32 \
            --output reports/ci_smoke_hf_matrix_multimodal.json \
            --quiet
