name: CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff
        run: ruff check multimodal_lm_eap_ig tests scripts

      - name: Pytest
        run: PYTHONPATH=. pytest -q

      - name: Build package
        run: python -m build

      - name: Validate package metadata
        run: twine check dist/*

      - name: Tiny HF smoke matrix
        run: |
          python scripts/smoke_hf_matrix.py \
            --text-models hf-internal-testing/tiny-random-gpt2 \
            --multimodal-models "" \
            --device cpu \
            --dtype float32 \
            --output reports/ci_smoke_hf_matrix.json \
            --quiet
