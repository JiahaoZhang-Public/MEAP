[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "multimodal_lm_eap_ig"
version = "0.0.1"
description = "EAP(IG) for Multimodal LM"
authors = [
  { name = "Jiahao Zhang" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["multimodal_lm_eap_ig"]
include = ["pyproject.toml", "multimodal_lm_eap_ig/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["multimodal_lm_eap_ig"]
force-sort-within-sections = true

